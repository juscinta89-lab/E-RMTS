<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#201e1d">
  <title>RMT Attendance SK Belukar</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <!-- Skrin log masuk -->
  <div id="auth" class="auth-wrap"></div>

  <!-- Aplikasi -->
  <div id="app" class="app"></div>

  <!-- Modal & Toast -->
  <div id="modal-back" class="modal-back"><div class="modal"></div></div>
  <div id="toasts"></div>

  <!-- Firebase SDK (compat). Digunakan hanya jika firebase-config.js diisi. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- LOADER MULTI-SEKOLAH:
       ?s=namasekolah  -> muat configs/namasekolah.js (projek Firebase sekolah itu)
       Tiada ?s=       -> guna ID tersimpan (lawatan sebelum ini / PWA yang di-install)
       Tiada langsung  -> fallback js/firebase-config.js (pemasangan tunggal biasa) -->
  <script>
  (function(){
    var id=null;
    try{
      var p=new URLSearchParams(location.search);
      id=p.get('s');
      if(id){ id=id.toLowerCase().replace(/[^a-z0-9_-]/g,''); localStorage.setItem('rmt_school',id); }
      else { id=localStorage.getItem('rmt_school'); }
    }catch(e){}
    window.__SCHOOL_ID__=id||null;
    var src = id ? ('./configs/'+id+'.js') : './js/firebase-config.js';
    document.write('<scr'+'ipt src="'+src+'"><\/scr'+'ipt>');
  })();
  </script>

  <script src="./js/app.js"></script>
</body>
</html>
